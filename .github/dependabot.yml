version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Kolkata" }
    commit-message: { prefix: "👷" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Kolkata" }
    open-pull-requests-limit: 10
    commit-message: { prefix: "👆" }
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

